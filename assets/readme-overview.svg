<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Jev Benchmark: cost, accuracy, and correctness</title>
<desc id="desc">Ten-model baseline accuracy versus cost per contract on 123 ContractNLI test contracts. Jev achieves 77.38 percent at 0.000228 US dollars per contract. Across 30 anchors, Jev is correct in all twelve responses for 23 targets, consistently wrong for five, and changes valid labels for two. Values come from the frozen formal-test metrics.</desc>
